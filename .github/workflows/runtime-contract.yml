name: runtime-contract

on:
  pull_request:
    paths:
      - "runtime/**"
      - "tests/**"
      - ".github/workflows/runtime-contract.yml"
      - "requirements-openai-agents.txt"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run deterministic runtime contract tests
        run: python -m unittest discover -s tests -p "test_*.py" -v

  test-sdk-binding:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install optional SDK compatibility dependency
        run: python -m pip install -r requirements-openai-agents.txt
      - name: Run offline SDK binding tests
        run: python -m unittest discover -s tests/sdk -p "test_*.py" -v
