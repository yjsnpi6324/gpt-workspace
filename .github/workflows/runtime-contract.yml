name: runtime-contract

on:
  pull_request:
    paths:
      - "runtime/**"
      - "tests/**"
      - ".github/workflows/runtime-contract.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run deterministic runtime contract tests
        run: python -m unittest discover -s tests -p "test_*.py" -v
